<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Newsletter - NAMEi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="default.css">

    <style>
        body {
            font-family: 'Roboto Mono', monospace;
            background: #0b0b0f;
            margin: 0;
            color: #fff;
        }

        /* NAV */
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        #navigation li {
            display: inline-block;
            margin: 0 1rem;
        }

        #navigation a {
            color: #fff;
            text-decoration: none;
            opacity: 0.7;
        }

        #navigation a:hover {
            opacity: 1;
        }

        /* HERO - SINGLE FOCUS */
        .hero {
            text-align: center;
            padding: 7rem 1rem 4rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.6rem;
            margin-bottom: 1rem;
        }

        .hero p {
            max-width: 600px;
            margin: 0 auto 2rem;
            opacity: 0.75;
            font-size: 1.05rem;
        }

        /* FORM (PRIMARY ACTION) */
        .subscribe-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .subscribe-box input {
            padding: 14px;
            width: 280px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
        }

        .subscribe-box button {
            padding: 14px 18px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #7f5af0, #2cb67d);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* TRUST ROW (MINIMAL PREMIUM) */
        .trust {
            text-align: center;
            margin-top: 4rem;
            opacity: 0.7;
        }

        .logo-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .logo-row img {
            width: 28px;
            height: 28px;
            filter: grayscale(1) brightness(2);
            opacity: 0.8;
            transition: 0.2s;
        }

        .logo-row img:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        /* FOOTER */
        .footer-wrapper {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.6;
            font-size: 0.9rem;
        }

    </style>
</head>

<body>

    <!-- NAV -->
    <div class="nav-wrapper">
        <div><strong>NAMEi</strong></div>
        <ul id="navigation">
            <li><a href="index.html">Home</a></li>
            <li><a href="blog.html">Blogs</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="membership.html">Membership</a></li>
            <li><a href="newsletter.html">Newsletter</a></li>
        </ul>
    </div>

    <!-- HERO (SINGLE FOCUS) -->
    <section class="hero">
        <h1>Weekly ideas that make you a better builder</h1>
        <p>No noise. Just practical coding insights, tools, and breakdowns delivered once a week.</p>

        <form class="subscribe-box">
            <input type="email" placeholder="Enter your email" required />
            <button type="submit">Subscribe</button>
        </form>
    </section>

    <!-- TRUST (MINIMAL, PREMIUM) -->
    <section class="trust">
        <div>Read by developers using</div>
        <div class="logo-row">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg" alt="GitHub" />
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/google.svg" alt="Google" />
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/microsoft.svg" alt="Microsoft" />
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/amazonaws.svg" alt="AWS" />
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/stripe.svg" alt="Stripe" />
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/vercel.svg" alt="Vercel" />
        </div>
    </section>

    <!-- FOOTER -->
    <div class="footer-wrapper">
        &copy; 2026 NAMEi. All Rights Reserved.
    </div>

</body>
</html>
