<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 650px;
      width: 100%;
      padding: 24px;
      background: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="email"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      font-weight: bold;
    }

    .trust {
      margin-top: 20px;
    }

    .logos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .logos img {
      width: 100%;
      height: 50px;
      object-fit: contain;
      background: #111;
      padding: 10px;
      border-radius: 10px;
      filter: grayscale(100%);
      opacity: 0.8;
      transition: 0.2s;
    }

    .logos img:hover {
      filter: grayscale(0%);
      opacity: 1;
      transform: scale(1.05);
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.5;
      text-align: center;
    }

    .hero-note {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Join the Newsletter</h1>
    <p>Get updates, coding challenges, and drops straight to your inbox.</p>

    <form>
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Subscribe</button>
    </form>

    <div class="hero-note">
      Built for developers, creators, and builders working with modern tech stacks.
    </div>

    <div class="trust">
      <strong>Tools and platforms developers love</strong>
      <div class="logos">
        <img src="https://logo.clearbit.com/github.com" alt="GitHub" />
        <img src="https://logo.clearbit.com/google.com" alt="Google" />
        <img src="https://logo.clearbit.com/microsoft.com" alt="Microsoft" />
        <img src="https://logo.clearbit.com/aws.amazon.com" alt="AWS" />
        <img src="https://logo.clearbit.com/stripe.com" alt="Stripe" />
        <img src="https://logo.clearbit.com/vercel.com" alt="Vercel" />
      </div>
    </div>

    <footer>
      Trusted by developers & creators worldwide
    </footer>
  </div>
</body>
</html>
